name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar plataformas
        run: dart run tool/preparar.dart
      - name: Configuração do Supabase
        run: echo '{"SUPABASE_URL":"${{ vars.SUPABASE_URL }}","SUPABASE_ANON_KEY":"${{ vars.SUPABASE_ANON_KEY }}"}' > env.json
      # Assinatura estável: sem ela, cada build sai com uma chave diferente e o Android
      # não deixa instalar a atualização por cima (teria de desinstalar e entrar de novo).
      - name: Chave de assinatura (opcional)
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE != '' }}
        run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - run: flutter build apk --release --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar plataformas
        run: dart run tool/preparar.dart
      - name: Configuração do Supabase
        shell: bash
        run: echo '{"SUPABASE_URL":"${{ vars.SUPABASE_URL }}","SUPABASE_ANON_KEY":"${{ vars.SUPABASE_ANON_KEY }}"}' > env.json
      - run: flutter build windows --release --dart-define-from-file=env.json
      - uses: actions/upload-artifact@v4
        with:
          name: controle-financeiro-windows
          path: build/windows/x64/runner/Release/
